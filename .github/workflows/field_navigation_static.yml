name: Field navigation static checks
on:
  push:
    branches:
      - feature/agt-robot-studio-v1
  pull_request:
  workflow_dispatch:
jobs:
  pure-python:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install standalone test dependencies
        run: python -m pip install --upgrade pytest PyYAML
      - name: Compile reviewed Python paths
        run: |
          python -m compileall -q workbench agt_field_test_bringup/agt_field_test_bringup scripts/ros_bridge.py agt_robot_studio/agt_robot_studio
      - name: Run ROS-independent regressions
        run: python -m pytest -q tests/test_goal_safety.py tests/test_local_ground_workbench.py
