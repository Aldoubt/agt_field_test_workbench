name: Field navigation static checks
on:
  push:
    branches:
      - feature/agt-robot-studio-v1
      - feature/field-automation-20261024
      - feature/agri-sc-kiss-20261025
  pull_request:
  workflow_dispatch:
jobs:
  pure-python:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install standalone test dependencies
        run: python -m pip install --upgrade pytest PyYAML numpy
      - name: Compile reviewed Python paths
        run: |
          python -m compileall -q workbench agt_field_test_bringup/agt_field_test_bringup scripts/ros_bridge.py scripts/mapping_pipeline.py scripts/no_pgo_mapping.py agt_robot_studio/agt_robot_studio agt_dynamic_map_cleaner/agt_dynamic_map_cleaner
      - name: Run ROS-independent regressions
        run: PYTHONPATH=.:agt_field_test_bringup:agt_dynamic_map_cleaner python -m pytest -q tests/test_goal_safety.py tests/test_local_ground_workbench.py tests/test_workbench.py tests/test_mapping_assets.py tests/test_livox_self_filter_contract.py tests/test_device_supervisor.py tests/test_dynamic_map_cleaner.py tests/test_map_diff.py tests/test_sc_mode.py::test_sc_database_bound_to_pcd_and_geometry_not_grid_pixels tests/test_session_startup.py tests/test_safety.py tests/test_field_automation.py
  qt-smoke:
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: agt_robot_studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install headless Qt dependencies
        run: python -m pip install --upgrade pytest PyQt5 numpy PyYAML
      - name: Exercise Qt Studio without ROS or hardware
        run: python -m pytest -q agt_robot_studio/test
