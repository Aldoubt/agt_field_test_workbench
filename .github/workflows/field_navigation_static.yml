name: Field navigation static checks
on:
  push:
    branches:
      - feature/agt-robot-studio-v1
  pull_request:
  workflow_dispatch:
jobs:
  pure-python:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install standalone test dependencies
        run: python -m pip install --upgrade pytest PyYAML numpy
      - name: Compile reviewed Python paths
        run: |
          python -m compileall -q workbench agt_field_test_bringup/agt_field_test_bringup scripts/ros_bridge.py scripts/mapping_pipeline.py scripts/no_pgo_mapping.py agt_robot_studio/agt_robot_studio agt_dynamic_map_cleaner/agt_dynamic_map_cleaner
      - name: Run ROS-independent regressions
        run: PYTHONPATH=.:agt_field_test_bringup:agt_dynamic_map_cleaner python -m pytest -q tests/test_goal_safety.py tests/test_local_ground_workbench.py tests/test_workbench.py tests/test_mapping_assets.py tests/test_livox_self_filter_contract.py tests/test_dynamic_map_cleaner.py
  qt-smoke:
    runs-on: ubuntu-22.04
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: agt_robot_studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install headless Qt dependencies
        run: python -m pip install --upgrade PyQt5 numpy PyYAML
      - name: Exercise Qt Studio without ROS or hardware
        run: python -m unittest discover -s agt_robot_studio/test -p 'test_qt_smoke.py' -v
