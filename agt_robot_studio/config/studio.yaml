robot: bunker
points_topic: /glim_rosnode/map
live_points_topic: /glim_rosnode/aligned_points
map_topic: /map
odom_topic: /odom
raw_lidar_topic: /livox/lidar
imu_topic: /livox/imu
# The default is NOT /cmd_vel; route this through an independently verified velocity guard.
drive_action: /drive_on_heading
spin_action: /spin
# Hard lock until independent Motion Guard and final velocity-chain watchdog are proven.
live_motion_enabled: false
drive_speed_mps: 0.08
# Until rear obstacle coverage, reverse clearance and braking are measured.
allow_reverse: false
safety_permitted_topic: /agt/safety/motion_permitted
max_linear_mps: 0.10
max_angular_rps: 0.25
max_acceleration_mps2: 0.15
guard_max_age_s: 1.5
motion_timeout_s: 20.0
bag_root: ~/agt_studio_runs
# Absolute path to a valid GLIM config directory. The app will not invent extrinsics.
glim_config_path: ''
