robot: bunker
points_topic: /glim_rosnode/map
live_points_topic: /glim_rosnode/aligned_points
map_topic: /map
odom_topic: /agt/odometry/local
raw_lidar_topic: /livox/lidar
imu_topic: /livox/imu
self_filter_status_topic: /mapping/self_filter/status
safety_permitted_topic: /agt/safety/motion_permitted

# Existing Field Test Workbench. The GUI starts a localhost service when needed.
workbench_api: http://127.0.0.1:8765
workbench_root: ''
auto_start_workbench: true

# Reuse already completed calibration and field evidence; no per-run recalibration.
calibration_bundle: ''
mount_profile: ''
geometry_file: ''
livox_config: ''
safety_report: ''
# Reuse operator setup already confirmed for this deployment. Nothing is auto-confirmed.
# Required by the existing backend for manual/navigation: wiring, physical_estop,
# remote_takeover, clear_area, supervised.
session_checks: {}

bag_root: ~/agt_studio_runs
record_template: full_field_test
# Empty list uses the template above. Otherwise recording uses this exact custom
# list; the independent recorder still records only topics currently present.
record_topics: []
# Local-ground (terrain-relative) PCD-to-grid parameters. These are NOT the
# obsolete global Z-height limits; Unknown remains Unknown by default.
projection:
  resolution: 0.05
  ground_cell_size: 0.5
  ground_percentile: 0.1
  ground_tolerance: 0.1
  obstacle_min_height: 0.12
  obstacle_max_height: 1.8
  occupied_threshold: 2
# Coarse global relocalization backend; both use small_gicp refinement.
# KISS additionally requires its locked native build and replay/field acceptance.
global_backend: bbs
# Mutually exclusive local odometry frontend; both publish base_link odometry.
lio_backend: fastlio2  # prefer Bunker FAST-LIO2; batch_lio is optional
# FAST-LIO2 without PGO is the current Bunker baseline. GLIM remains experimental
# until its dependencies, configuration and real-bag replay are accepted.
mapping_backend: fastlio  # fastlio or glim_experimental
save_mapping_data: true
# Autolabor C1 capability used by V3 stop-and-shoot missions.
enable_camera_gimbal: true
camera_device_path: /dev/video0
gimbal_port_name: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
# Absolute path to a valid GLIM config directory. The app never invents extrinsics.
glim_config_path: ''
glim_package: glim_ros
glim_node: glim_rosnode
glim_editor: map_editor
map_frame: map

# GUI-saved overrides are stored outside the install tree in
# ~/.config/agt_robot_studio/studio.yaml and loaded after this deployment file.
